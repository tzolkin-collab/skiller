<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#0a0a0c" />
  
  <!-- Window Frame -->
  <g transform="translate(100, 100)">
    <rect width="600" height="400" rx="8" fill="#141416" stroke="#222" stroke-width="2" />
    <!-- Header -->
    <rect width="600" height="40" rx="8" fill="#1a1a1d" />
    <path d="M 0 40 L 600 40" stroke="#222" stroke-width="2" />
    <circle cx="20" cy="20" r="6" fill="#333" />
    <circle cx="40" cy="20" r="6" fill="#333" />
    <circle cx="60" cy="20" r="6" fill="#333" />
    
    <!-- Video Player Area -->
    <rect x="40" y="80" width="340" height="200" fill="#000" rx="4" />
    <!-- Play Button -->
    <circle cx="210" cy="180" r="30" fill="#FF003C" opacity="0.8" />
    <polygon points="200,165 200,195 225,180" fill="#fff" />
    
    <!-- Playlist Area -->
    <rect x="420" y="80" width="140" height="200" fill="#111" rx="4" stroke="#222" stroke-width="1" />
    <rect x="430" y="90" width="120" height="30" fill="#222" rx="2" />
    <rect x="430" y="130" width="120" height="30" fill="#1a1a1d" rx="2" />
    <rect x="430" y="170" width="120" height="30" fill="#1a1a1d" rx="2" />
    <rect x="430" y="210" width="120" height="30" fill="#1a1a1d" rx="2" />
    
    <!-- Meta Data Bars -->
    <rect x="40" y="300" width="240" height="12" fill="#333" rx="4" />
    <rect x="40" y="320" width="180" height="12" fill="#222" rx="4" />
  </g>
  
  <!-- Red Scanner line -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#FF003C" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />
</svg>
