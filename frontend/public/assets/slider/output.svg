<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#0a0a0c" />
  
  <g transform="translate(100, 80)">
    <!-- Editor Window -->
    <rect width="600" height="440" rx="6" fill="#0f0f11" stroke="#222" stroke-width="2" />
    
    <!-- Sidebar -->
    <rect width="150" height="440" fill="#141416" stroke="#222" stroke-width="2" />
    <rect x="15" y="20" width="80" height="10" fill="#444" rx="2" />
    <rect x="15" y="45" width="100" height="8" fill="#FF003C" opacity="0.6" rx="2" />
    <rect x="15" y="65" width="90" height="8" fill="#333" rx="2" />
    <rect x="15" y="85" width="110" height="8" fill="#333" rx="2" />
    
    <!-- Main editor area -->
    <!-- Header -->
    <rect x="150" y="0" width="450" height="40" fill="#141416" />
    <path d="M 150 40 L 600 40" stroke="#222" stroke-width="2" />
    <rect x="170" y="10" width="120" height="30" fill="#0f0f11" rx="4" />
    <text x="185" y="30" font-family="monospace" font-size="12" fill="#FF003C">SKILL.md</text>
    
    <!-- Content -->
    <rect x="180" y="70" width="200" height="16" fill="#eee" rx="2" />
    <rect x="180" y="110" width="380" height="8" fill="#666" rx="2" />
    <rect x="180" y="130" width="340" height="8" fill="#666" rx="2" />
    
    <!-- Code block -->
    <rect x="180" y="170" width="380" height="120" fill="#1a1a1d" stroke="#333" stroke-width="1" rx="4" />
    <rect x="200" y="190" width="120" height="8" fill="#FF003C" opacity="0.8" rx="2" />
    <rect x="200" y="210" width="240" height="8" fill="#aaa" rx="2" />
    <rect x="200" y="230" width="200" height="8" fill="#aaa" rx="2" />
    
    <rect x="180" y="320" width="300" height="8" fill="#666" rx="2" />
    <rect x="180" y="340" width="260" height="8" fill="#666" rx="2" />
  </g>
</svg>
