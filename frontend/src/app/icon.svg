<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes rise1 {
      0% { stroke-dashoffset: 20; opacity: 0; }
      20% { opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -20; opacity: 0; }
    }
    @keyframes rise2 {
      0% { stroke-dashoffset: 20; opacity: 0; }
      20% { opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -20; opacity: 0; }
    }
    @keyframes rise3 {
      0% { stroke-dashoffset: 20; opacity: 0; }
      20% { opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -20; opacity: 0; }
    }
    .smoke1 {
      stroke-dasharray: 20;
      animation: rise1 2s infinite linear;
    }
    .smoke2 {
      stroke-dasharray: 20;
      animation: rise2 2s infinite linear 0.7s;
    }
    .smoke3 {
      stroke-dasharray: 20;
      animation: rise3 2s infinite linear 1.4s;
    }
    .cup {
      fill: #ff3333;
      fill-opacity: 0.1;
      stroke: #ff3333;
    }
    .handle {
      stroke: #ff3333;
    }
  </style>
  <path class="smoke1" d="M16 12C16 8 20 6 20 2" stroke="#ff3333" stroke-width="4" stroke-linecap="square" />
  <path class="smoke2" d="M24 14C24 9 28 7 28 3" stroke="#ff3333" stroke-width="4" stroke-linecap="square" />
  <path class="smoke3" d="M32 12C32 8 36 6 36 2" stroke="#ff3333" stroke-width="4" stroke-linecap="square" />
  <path class="cup" d="M8 18H36V30C36 35.5 31.5 40 26 40H18C12.5 40 8 35.5 8 30V18Z" stroke-width="4" stroke-linejoin="miter" />
  <path class="handle" d="M36 22H40C42.2091 22 44 23.7909 44 26C44 28.2091 42.2091 30 40 30H36" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter" />
</svg>
